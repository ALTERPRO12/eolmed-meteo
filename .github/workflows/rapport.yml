# Rapport météo-océanique EolMed — envoi automatique depuis GitHub (aucun ordinateur allumé nécessaire)
# Heures d'envoi (Paris) : ~05:30, 11:30, 16:30, 21:30. GitHub peut retarder un départ de quelques minutes.
# Secrets à créer (Settings > Secrets and variables > Actions) :
#   EOLMED_SMTP_SERVER, EOLMED_SMTP_PORT, EOLMED_SMTP_USER, EOLMED_SMTP_PASSWORD, EOLMED_EMAIL_TO
name: Rapport météo EolMed

on:
  schedule:
    - cron: "25 4,10,15,20 * * *"   # heure d'hiver (Paris = UTC+1)
    - cron: "25 3,9,14,19 * * *"    # heure d'été (Paris = UTC+2)
  workflow_dispatch:
    inputs:
      mode:
        description: "pdf-only = PDF sans envoi ; send = envoi du mail"
        type: choice
        options: [pdf-only, send]
        default: pdf-only
      to:
        description: "Destinataire(s) de test, séparés par des virgules (vide = liste complète)"
        required: false
        default: ""

concurrency:
  group: eolmed-report
  cancel-in-progress: false

jobs:
  creneau:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - id: c
        env:
          SCHED: ${{ github.event.schedule }}
        run: |
          off=$(TZ=Europe/Paris date +%z)
          go=true
          if [ -n "$SCHED" ]; then
            if [ "$off" = "+0100" ] && [ "$SCHED" != "25 4,10,15,20 * * *" ]; then go=false; fi
            if [ "$off" = "+0200" ] && [ "$SCHED" != "25 3,9,14,19 * * *" ]; then go=false; fi
          fi
          echo "Décalage Paris $off, planification '$SCHED' -> go=$go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  rapport:
    needs: creneau
    if: needs.creneau.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: report/requirements.txt
      - run: pip install -r report/requirements.txt
      - name: Produire et envoyer le rapport
        working-directory: report
        env:
          TZ: Europe/Paris
          EOLMED_SMTP_SERVER: ${{ secrets.EOLMED_SMTP_SERVER }}
          EOLMED_SMTP_PORT: ${{ secrets.EOLMED_SMTP_PORT }}
          EOLMED_SMTP_USER: ${{ secrets.EOLMED_SMTP_USER }}
          EOLMED_SMTP_PASSWORD: ${{ secrets.EOLMED_SMTP_PASSWORD }}
          EOLMED_EMAIL_TO: ${{ secrets.EOLMED_EMAIL_TO }}
          EOLMED_OUTPUT_DIR: ${{ github.workspace }}/out
          MODE: ${{ inputs.mode }}
          TEST_TO: ${{ inputs.to }}
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$MODE" = "pdf-only" ]; then args+=(--pdf-only); fi
            if [ -n "$TEST_TO" ]; then args+=(--to "$TEST_TO"); fi
          fi
          for i in 1 2 3; do
            echo "=== essai $i ==="
            if python eolmed_weather_report.py "${args[@]}"; then exit 0; fi
            sleep 90
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-${{ github.run_number }}
          path: out/*.pdf
          retention-days: 90
          if-no-files-found: ignore
