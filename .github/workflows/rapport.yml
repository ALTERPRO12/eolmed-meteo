# Rapport météo-océanique EolMed — envoi automatique depuis GitHub (aucun ordinateur allumé nécessaire)
# Créneaux (heure de Paris, été comme hiver) : 05:30, 11:30, 16:30, 21:30.
# GitHub vérifie toutes les 30 min (à :07 et :37). Le rapport d'un créneau part au premier passage
# après l'heure du créneau, une seule fois (marqueur "envoi-AAAAMMJJ-HHMM"), et au plus tard 3 h après.
# Secrets : EOLMED_SMTP_SERVER, EOLMED_SMTP_PORT, EOLMED_SMTP_USER, EOLMED_SMTP_PASSWORD, EOLMED_EMAIL_TO
name: Rapport météo EolMed

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "pdf-only = PDF sans envoi ; send = envoi du mail"
        type: choice
        options: [pdf-only, send]
        default: pdf-only
      to:
        description: "Destinataire(s) de test, séparés par des virgules (vide = liste complète)"
        required: false
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: eolmed-report
  cancel-in-progress: false

jobs:
  creneau:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.c.outputs.go }}
      marker: ${{ steps.c.outputs.marker }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ inputs.mode }}
          TEST_TO: ${{ inputs.to }}
        run: |
          now=$(TZ=Europe/Paris date +%H%M); day=$(TZ=Europe/Paris date +%Y%m%d)
          m=$((10#${now:0:2}*60 + 10#${now:2:2}))
          slot=""
          for s in 2130 1630 1130 0530; do
            if [ "$m" -ge $((10#${s:0:2}*60 + 10#${s:2:2})) ]; then slot=$s; break; fi
          done
          late=9999
          if [ -n "$slot" ]; then late=$((m - (10#${slot:0:2}*60 + 10#${slot:2:2}))); fi
          marker=""
          if [ -n "$slot" ]; then marker="envoi-$day-$slot"; fi
          deja=0
          if [ -n "$marker" ]; then
            deja=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/artifacts?name=$marker" | jq -r '.total_count // 0')
          fi
          go=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            go=true
            # un envoi manuel à la liste complète compte pour le créneau en cours
            if [ "$MODE" != "send" ] || [ -n "$TEST_TO" ] || [ "$late" -gt 180 ]; then marker=""; fi
          elif [ -n "$slot" ] && [ "$late" -le 180 ] && [ "$deja" = "0" ]; then
            go=true
          fi
          echo "Paris $day $now | créneau=${slot:-aucun} | retard=${late} min | déjà envoyé=$deja | go=$go | marqueur=${marker:-aucun}"
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "marker=$marker" >> "$GITHUB_OUTPUT"

  rapport:
    needs: creneau
    if: needs.creneau.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: report/requirements.txt
      - run: pip install -r report/requirements.txt
      - name: Produire et envoyer le rapport
        working-directory: report
        env:
          TZ: Europe/Paris
          EOLMED_SMTP_SERVER: ${{ secrets.EOLMED_SMTP_SERVER }}
          EOLMED_SMTP_PORT: ${{ secrets.EOLMED_SMTP_PORT }}
          EOLMED_SMTP_USER: ${{ secrets.EOLMED_SMTP_USER }}
          EOLMED_SMTP_PASSWORD: ${{ secrets.EOLMED_SMTP_PASSWORD }}
          EOLMED_EMAIL_TO: ${{ secrets.EOLMED_EMAIL_TO }}
          EOLMED_OUTPUT_DIR: ${{ github.workspace }}/out
          MODE: ${{ inputs.mode }}
          TEST_TO: ${{ inputs.to }}
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$MODE" = "pdf-only" ]; then args+=(--pdf-only); fi
            if [ -n "$TEST_TO" ]; then args+=(--to "$TEST_TO"); fi
          fi
          for i in 1 2 3; do
            echo "=== essai $i ==="
            if python eolmed_weather_report.py "${args[@]}"; then exit 0; fi
            sleep 90
          done
          exit 1
      - name: Marquer le créneau comme envoyé
        if: success() && needs.creneau.outputs.marker != ''
        run: echo "${{ needs.creneau.outputs.marker }} $(date -u)" > marqueur.txt
      - uses: actions/upload-artifact@v4
        if: success() && needs.creneau.outputs.marker != ''
        with:
          name: ${{ needs.creneau.outputs.marker }}
          path: marqueur.txt
          retention-days: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-${{ github.run_number }}
          path: out/*.pdf
          retention-days: 90
          if-no-files-found: ignore
